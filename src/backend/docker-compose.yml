version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: lunar_aurora_postgis
    restart: always
    environment:
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: aurora123
      POSTGRES_DB: lunar_aurora
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: lunar_aurora_api
    restart: always
    depends_on:
      - postgis
    ports:
      - "8000:8000"
    environment:
      - ENABLE_POSTGRES=1
      - POSTGIS_URL=postgresql://luna:aurora123@postgis:5432/lunar_aurora
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./static:/app/static

volumes:
  postgis_data:

